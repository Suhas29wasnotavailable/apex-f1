name: Replay site

# Deploys the replay page attached to the `replay` release. `make publish` builds the page locally,
# because it needs the fitted parameters and traced tracks, which are not in the repository, then
# uploads it and starts this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Fetch the published page
        run: gh release download replay --repo "$GITHUB_REPOSITORY" --pattern index.html --dir site
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
