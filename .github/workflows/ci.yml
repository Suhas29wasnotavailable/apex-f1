name: CI

# The same gate as `make check`: lint, strict types, and every test that runs offline.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Install (Python from .python-version, locked dependencies)
        run: uv sync --frozen --group dev --extra data --extra fit
      - name: Lint
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Types (mypy strict)
        run: uv run --frozen mypy
      - name: Tests (offline)
        run: uv run --frozen pytest -m "not network"
