[project]
name = "apex"
version = "0.1.0"
description = "A calibrated digital twin of a Formula 1 race, and an honest test of whether reinforcement learning beats dynamic programming at race strategy."
readme = "README.md"
requires-python = "==3.11.*"
license = { file = "LICENSE" }
authors = [{ name = "Suhas" }]
keywords = ["formula1", "reinforcement-learning", "simulation", "digital-twin"]

# Core dependencies only. Anything heavy (torch, fastf1, statsmodels) lives in an
# extra so that CI lint/type/test stays fast and each phase installs only what it needs.
dependencies = [
    "numpy>=2.1",
    "polars>=1.20",
    "pyarrow>=18.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[project.scripts]
apex = "apex.cli:app"

[project.optional-dependencies]
# P1 -- ingestion and calibration
data = ["fastf1>=3.8.3"]
fit = ["scipy>=1.14", "statsmodels>=0.14.4", "matplotlib>=3.9"]
# P4 -- reinforcement learning
rl = ["torch>=2.5", "gymnasium>=1.0", "stable-baselines3>=2.4", "mlflow>=2.19"]
# P5 -- serving
api = ["fastapi>=0.115", "uvicorn[standard]>=0.34", "onnxruntime>=1.20", "websockets>=14.0"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.122",
    "ruff>=0.9",
    "mypy>=1.14",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apex"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["apex", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "A",         # builtins shadowing
    "C4",        # comprehensions
    "SIM",       # simplify
    "TID",       # tidy imports
    "PTH",       # use pathlib
    "ARG",       # unused arguments
    "PL",        # pylint
    "NPY",       # numpy-specific
    "RUF",       # ruff-specific
]
ignore = [
    "PLR0913",  # many arguments -- simulator and model constructors legitimately need them
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]  # magic values are the point of a test

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# --------------------------------------------------------------------------- mypy
[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_unimported = true
show_error_codes = true
files = ["apex", "tests"]

# Third-party packages that ship no type information. Listed explicitly rather than
# globally silenced, so that a newly-typed release is noticed instead of ignored.
[[tool.mypy.overrides]]
module = [
    "fastf1.*",
    "statsmodels.*",
    "scipy.*",
    "matplotlib.*",
    "stable_baselines3.*",
    "mlflow.*",
    "onnxruntime.*",
]
ignore_missing_imports = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "network: test requires network access (excluded from CI)",
    "slow: test takes more than a few seconds",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["apex"]
branch = true
