<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · APEX</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #0a0d12;
    --panel: #12171f;
    --panel-2: #171d27;
    --line: #232b38;
    --ink: #e8edf5;
    --ink-dim: #8896ab;
    --ink-faint: #5a6678;
    --track: #2b323d;
    --track-edge: #3d4654;
    --green: #2ee56d;
    --yellow: #ffd21f;
    --purple: #b14bf4;
    --accent: #5aa9ff;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --cond: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    --sans: Barlow, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 14px/1.45 var(--sans);
    font-variant-numeric: tabular-nums;
    display: flex; flex-direction: column; overflow: hidden;
  }

  header {
    display: flex; align-items: center; gap: 18px;
    padding: 12px 18px; border-bottom: 1px solid var(--line);
    background: var(--panel); flex: none;
  }
  .brand { font: 700 13px/1 var(--cond); letter-spacing: .22em; color: var(--accent); }
  .title { font: 600 19px/1.1 var(--cond); letter-spacing: .01em; }
  .sub { color: var(--ink-faint); font-size: 12px; }
  .spacer { flex: 1; }
  .lapbox { font: 600 13px/1 var(--mono); color: var(--ink-dim); }
  .lapbox b { color: var(--ink); font: 700 20px/1 var(--mono); }
  .flag {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 11px; border-radius: 999px; font: 600 11px/1 var(--mono);
    letter-spacing: .08em; background: #10321d; color: var(--green);
  }
  .flag.sc  { background: #3a2f06; color: var(--yellow); }
  .flag.vsc { background: #33290a; color: #ffe27a; }
  .flag.end { background: #1b2330; color: var(--ink-dim); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .flag.sc .dot, .flag.vsc .dot { animation: blink 1s steps(2, start) infinite; }
  @keyframes blink { 50% { opacity: .25; } }

  main { flex: 1; display: flex; min-height: 0; }
  .stage { flex: 1; position: relative; min-width: 0; background:
    radial-gradient(1200px 700px at 50% 42%, #101620 0%, var(--bg) 70%); }
  canvas { display: block; width: 100%; height: 100%; }
  .stamp {
    position: absolute; left: 16px; bottom: 14px; font: 11px/1.6 var(--mono);
    color: var(--ink-faint); pointer-events: none;
  }

  aside {
    width: 330px; flex: none; border-left: 1px solid var(--line);
    background: var(--panel); display: flex; flex-direction: column; min-height: 0;
  }
  .aside-head {
    padding: 9px 14px; font: 600 10px/1 var(--mono); letter-spacing: .12em;
    color: var(--ink-faint); border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between;
  }
  .board { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
  .row {
    display: grid; grid-template-columns: 24px 10px 44px 62px 1fr 28px 22px;
    align-items: center; gap: 7px; padding: 7px 13px;
    border-bottom: 1px solid #1a212c; font-size: 13px;
  }
  .last { font: 500 12px/1 var(--mono); color: var(--ink-dim); }
  /* Purple marks whoever holds the fastest lap of the race, and it stays with them until somebody
     takes it -- which is how a timing tower shows it, and it is the one badge here that changes
     hands mid-race. */
  .code.fastest { color: var(--purple); }
  .code.fastest::after { content: " \25CF"; font-size: 8px; vertical-align: 2px; }
  .row.pitting { background: #1d2331; }
  .pos { font: 600 12px/1 var(--mono); color: var(--ink-dim); text-align: right; }
  .bar { width: 4px; height: 20px; border-radius: 2px; }
  .code { font: 700 14px/1 var(--cond); letter-spacing: .09em; }
  .gap { font: 12px/1 var(--mono); color: var(--ink-dim); }
  .tyre {
    width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center;
    font: 700 10px/1 var(--mono); color: #0a0d12; border: 2px solid #0a0d12;
  }
  .age { font: 11px/1 var(--mono); color: var(--ink-faint); text-align: right; }
  .tag {
    font: 600 9px/1 var(--mono); letter-spacing: .08em; color: var(--yellow);
  }

  footer {
    flex: none; border-top: 1px solid var(--line); background: var(--panel);
    padding: 10px 18px; display: flex; align-items: center; gap: 16px;
  }
  button {
    background: var(--panel-2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 7px; padding: 7px 13px; font: 600 12px/1 var(--mono); cursor: pointer;
  }
  button:hover { border-color: #3a465a; }
  button.on { background: var(--accent); border-color: var(--accent); color: #06101d; }
  .play { width: 44px; }
  .speeds { display: flex; gap: 5px; }
  .clock { font: 12px/1 var(--mono); color: var(--ink-dim); min-width: 108px; }
  .scrub { flex: 1; position: relative; height: 26px; min-width: 120px; }
  .scrub input {
    position: absolute; inset: 0; width: 100%; height: 100%; margin: 0;
    -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer;
  }
  .scrub input::-webkit-slider-runnable-track { height: 26px; background: transparent; }
  .scrub input::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 22px; margin-top: 2px;
    border-radius: 3px; background: var(--ink); border: none; cursor: pointer;
  }
  .scrub input::-moz-range-thumb {
    width: 12px; height: 22px; border-radius: 3px; background: var(--ink); border: none;
  }
  .ticks {
    position: absolute; left: 0; right: 0; top: 9px; height: 8px;
    border-radius: 4px; background: #1d2431; overflow: hidden; pointer-events: none;
  }
  .ticks .band { position: absolute; top: 0; bottom: 0; }
  .ticks .band.sc  { background: var(--yellow); opacity: .85; }
  .ticks .band.vsc { background: #8a7418; }
  .ticks .done { position: absolute; top: 0; bottom: 0; left: 0; background: #33405a; }

  .picker {
    display: inline-flex; align-items: center; gap: 8px;
    font: 600 10px/1 var(--mono); letter-spacing: .12em; color: var(--ink-faint);
  }
  .picker select {
    background: var(--panel-2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 9px; font: 600 12px/1 var(--cond);
    letter-spacing: .06em; cursor: pointer; max-width: 190px;
  }

  .tabs { display: flex; border-bottom: 1px solid var(--line); flex: none; }
  .tab {
    flex: 1; background: none; border: none; border-radius: 0; color: var(--ink-faint);
    padding: 10px 4px; font: 600 11px/1 var(--cond); letter-spacing: .12em;
    text-transform: uppercase; border-bottom: 2px solid transparent;
  }
  .tab:hover { color: var(--ink-dim); }
  .tab.on { color: var(--ink); border-bottom-color: var(--accent); }
  .panel { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .panel.on { display: flex; }

  /* Strategy: one row per car, stints laid out as a proportional bar of the race distance. */
  .srow {
    display: grid; grid-template-columns: 44px 1fr 26px; align-items: center;
    gap: 9px; padding: 7px 13px; border-bottom: 1px solid #1a212c;
  }
  .track-bar { display: flex; height: 17px; border-radius: 4px; overflow: hidden; gap: 1px; }
  .stint {
    display: grid; place-items: center; min-width: 0;
    font: 700 9px/1 var(--mono); color: #0a0d12;
  }
  .stops { font: 12px/1 var(--mono); color: var(--ink-dim); text-align: right; }

  /* Conditions: observed readings, visibly separated from anything the simulator produced. */
  .cond { padding: 13px; display: flex; flex-direction: column; gap: 13px; }
  .cond-note {
    font: 400 11px/1.55 var(--sans); color: var(--ink-faint);
    border-left: 2px solid var(--line); padding-left: 10px;
  }
  .cond-note b { color: var(--ink-dim); font-weight: 600; }
  .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
  .stat {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px;
  }
  .stat .k {
    font: 600 9px/1 var(--mono); letter-spacing: .11em; color: var(--ink-faint);
    text-transform: uppercase;
  }
  .stat .v { font: 600 17px/1.25 var(--mono); color: var(--ink); }
  .stat .u { font-size: 11px; color: var(--ink-dim); }
  .spark { display: block; width: 100%; height: 42px; }
  .cond h4 {
    margin: 0; font: 600 10px/1 var(--mono); letter-spacing: .12em;
    color: var(--ink-faint); text-transform: uppercase;
  }
  .trap { display: flex; flex-direction: column; gap: 5px; }
  .trap-row {
    display: grid; grid-template-columns: 1fr 44px; align-items: center; gap: 8px;
    font: 12px/1 var(--sans); color: var(--ink-dim);
  }
  .trap-bar { height: 13px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
  .trap-bar i { display: block; height: 100%; background: var(--accent); opacity: .7; }
  .trap-row b { font: 500 11px/1 var(--mono); color: var(--ink); text-align: right; }
  .wet { color: var(--yellow); }

  @media (max-width: 880px) {
    main { flex-direction: column; }
    aside { width: auto; border-left: none; border-top: 1px solid var(--line); max-height: 42%; }
  }
</style>
</head>
<body>

<header>
  <span class="brand">APEX</span>
  <div>
    <div class="title" id="title">—</div>
    <div class="sub" id="subtitle">—</div>
  </div>
  <span class="spacer"></span>
  <label class="picker">
    <span>CIRCUIT</span>
    <select id="circuit" aria-label="Circuit"></select>
  </label>
  <div class="lapbox">LAP <b id="lap">1</b><span id="totalLaps"></span></div>
  <span class="flag" id="flag"><span class="dot"></span><span id="flagText">GREEN</span></span>
</header>

<main>
  <div class="stage">
    <canvas id="canvas"></canvas>
    <div class="stamp" id="stamp"></div>
  </div>
  <aside>
    <div class="tabs" role="tablist">
      <button class="tab on" data-panel="order" role="tab">Order</button>
      <button class="tab" data-panel="strategy" role="tab">Strategy</button>
      <button class="tab" data-panel="conditions" role="tab">Conditions</button>
    </div>
    <div class="panel on" id="panel-order">
      <div class="aside-head"><span>ORDER</span><span>LAST LAP · GAP · TYRE</span></div>
      <div class="board" id="board"></div>
    </div>
    <div class="panel" id="panel-strategy">
      <div class="aside-head"><span>STINTS</span><span id="stintNote">TYRES USED</span></div>
      <div class="board" id="stints"></div>
    </div>
    <div class="panel" id="panel-conditions">
      <div class="aside-head"><span>CONDITIONS</span><span>OBSERVED, NOT SIMULATED</span></div>
      <div class="board" id="conditions"></div>
    </div>
  </aside>
</main>

<footer>
  <button class="play" id="play">▶</button>
  <div class="speeds" id="speeds"></div>
  <div class="clock" id="clock">0:00 / 0:00</div>
  <div class="scrub">
    <div class="ticks" id="ticks"><div class="done" id="done"></div></div>
    <input type="range" id="range" min="0" max="1000" value="0" step="1" aria-label="Race time">
  </div>
</footer>

<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
(function () {
  "use strict";
  const BUNDLE = JSON.parse(document.getElementById("payload").textContent);
  const RACES = BUNDLE.races;

  // Everything below reads these. Selecting a circuit rebinds them and rebuilds the derived model,
  // which is cheap: a race is a few thousand numbers, and rebuilding beats keeping several races'
  // worth of derived state alive at once.
  let DATA, TRACK, LINE, PROFILE, N, CARS, DURATION, LEADER_AT, FASTEST, cx, cy;

  // ---------------------------------------------------------------- race model
  // A car's position at an instant is not stored; it is derived. Each car carries its crossing
  // times, and the lap it is on at time t is found by walking that array. Fractional progress
  // through the lap then goes through the circuit's real time-to-distance profile, so a car slows
  // for the corners instead of sliding round at a constant rate.

  function selectRace(index) {
    DATA = RACES[index];
    TRACK = DATA.track;
    LINE = TRACK.centreline;
    PROFILE = TRACK.distanceProfile;
    N = LINE.length;

    CARS = DATA.cars.map(function (car, slot) {
      const laps = car.laps;
      return Object.assign({}, car, {
        slot: slot,
        ends: laps.map(function (l) { return l.end; }),
        starts: laps.map(function (l) { return l.end - l.time; }),
        finishAt: laps.length ? laps[laps.length - 1].end : 0,
      });
    });
    DURATION = DATA.raceDurationS;

    // The leader's crossing time for each lap, for the lap counter and the timeline bands.
    LEADER_AT = [];
    for (let lap = 1; lap <= DATA.totalLaps; lap++) {
      let best = Infinity;
      for (const car of CARS) {
        const entry = car.laps[lap - 1];
        if (entry && entry.end < best) best = entry.end;
      }
      LEADER_AT.push(isFinite(best) ? best : DURATION);
    }
    FASTEST = buildFastest();

    cx = 0; cy = 0;
    for (const point of LINE) { cx += point[0]; cy += point[1]; }
    cx /= N; cy /= N;
  }

  function distanceFraction(timeFraction) {
    const t = Math.min(Math.max(timeFraction, 0), 1);
    const at = t * (PROFILE.length - 1);
    const i = Math.floor(at);
    if (i >= PROFILE.length - 1) return PROFILE[PROFILE.length - 1];
    const w = at - i;
    return PROFILE[i] * (1 - w) + PROFILE[i + 1] * w;
  }

  function stateOf(car, t) {
    const laps = car.laps;
    if (!laps.length) return null;

    // `dFrac` is where to draw the car; `order` is how far it has actually got. They are separate
    // because a car on the grid sits just *before* the line, at 99% of a lap, and ranking on that
    // would show the whole grid as nearly a lap ahead of the car that has already started.
    if (t < car.starts[0]) {
      return {
        lapIndex: 0, lap: 1, dFrac: 1 - 0.0075 * (car.slot + 1),
        order: -0.001 * (car.slot + 1),
        onGrid: true, finished: false, entry: laps[0],
      };
    }
    if (t >= car.finishAt) {
      return {
        lapIndex: laps.length - 1, lap: DATA.totalLaps, dFrac: 0,
        // Finished cars rank among themselves by who finished first, and all of them ahead of
        // anyone still running.
        order: DATA.totalLaps + 1 - car.finishAt / (DURATION + 1),
        onGrid: false, finished: true, entry: laps[laps.length - 1],
      };
    }
    // Linear scan from a guess. Laps are near-uniform in length, so the guess lands within a lap
    // or two and this costs a handful of comparisons rather than a binary search per car per frame.
    let i = Math.min(laps.length - 1, Math.max(0, Math.floor((t / DURATION) * laps.length)));
    while (i > 0 && t < car.starts[i]) i--;
    while (i < laps.length - 1 && t >= car.ends[i]) i++;

    const entry = laps[i];
    const tFrac = (t - car.starts[i]) / entry.time;
    const dFrac = distanceFraction(tFrac);
    return {
      lapIndex: i, lap: entry.lap, dFrac: dFrac,
      order: i + dFrac,
      onGrid: false, finished: false, entry: entry,
      // The gap a pit wall would be quoting: the one measured at the last completed crossing.
      // Using this lap's own end-of-lap gap would be showing a number that has not happened yet.
      measured: i > 0 ? laps[i - 1] : null,
    };
  }

  // Every completed lap in the race, in the order the line was crossed, carrying the fastest time
  // seen up to that point. A running minimum computed once, so "who holds the fastest lap right
  // now" is a lookup rather than a scan over every car on every frame. Purple for the fastest lap
  // of the race is F1's own convention and it is the one thing on this screen that changes hands.
  function buildFastest() {
    const events = [];
    for (const car of CARS) {
      for (const entry of car.laps) {
        if (entry.pit) continue;           // an in-lap is not a representative lap
        events.push({ at: entry.end, time: entry.time, driver: car.driver });
      }
    }
    events.sort(function (a, b) { return a.at - b.at; });
    let best = Infinity, holder = null;
    for (const event of events) {
      if (event.time < best) { best = event.time; holder = event.driver; }
      event.best = best;
      event.holder = holder;
    }
    return events;
  }

  function fastestAt(t) {
    let low = 0, high = FASTEST.length - 1, found = null;
    while (low <= high) {
      const mid = (low + high) >> 1;
      if (FASTEST[mid].at <= t) { found = FASTEST[mid]; low = mid + 1; } else { high = mid - 1; }
    }
    return found;
  }

  function leaderLap(t) {
    let lap = 1;
    for (let i = 0; i < LEADER_AT.length; i++) {
      if (t >= LEADER_AT[i]) lap = i + 2;
    }
    return Math.min(lap, DATA.totalLaps);
  }

  function flagAt(t) {
    return DATA.flags[String(leaderLap(t))] || "green";
  }

  // ---------------------------------------------------------------- geometry
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  let view = { scale: 1, ox: 0, oy: 0 };

  function layout() {
    const dpr = window.devicePixelRatio || 1;
    const w = canvas.clientWidth, h = canvas.clientHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const pad = 46;
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const p of LINE) {
      if (p[0] < minX) minX = p[0];
      if (p[0] > maxX) maxX = p[0];
      if (p[1] < minY) minY = p[1];
      if (p[1] > maxY) maxY = p[1];
    }
    const scale = Math.min((w - pad * 2) / (maxX - minX), (h - pad * 2) / (maxY - minY));
    view = {
      scale: scale,
      ox: w / 2 - ((minX + maxX) / 2) * scale,
      // Screen y grows downward while track coordinates grow upward, so y is flipped here.
      oy: h / 2 + ((minY + maxY) / 2) * scale,
    };
  }

  function project(x, y) {
    return [x * view.scale + view.ox, -y * view.scale + view.oy];
  }

  function pointAt(dFrac) {
    const wrapped = ((dFrac % 1) + 1) % 1;
    const at = wrapped * N;
    const i = Math.floor(at) % N;
    const j = (i + 1) % N;
    const w = at - Math.floor(at);
    return [LINE[i][0] * (1 - w) + LINE[j][0] * w, LINE[i][1] * (1 - w) + LINE[j][1] * w];
  }

  function tracePath() {
    ctx.beginPath();
    for (let i = 0; i < N; i++) {
      const p = project(LINE[i][0], LINE[i][1]);
      if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]);
    }
    ctx.closePath();
  }

  function drawTrack(flag) {
    const width = Math.max(7, view.scale * 0.017);
    ctx.lineJoin = ctx.lineCap = "round";

    tracePath();
    ctx.strokeStyle = flag === "green" ? "#3d4654" : "#6b5c14";
    ctx.lineWidth = width + 5;
    ctx.stroke();

    tracePath();
    ctx.strokeStyle = "#2b323d";
    ctx.lineWidth = width;
    ctx.stroke();

    // Start/finish line, drawn across the track at the first centreline point.
    const a = pointAt(0), b = pointAt(0.004);
    const p = project(a[0], a[1]), q = project(b[0], b[1]);
    const dx = q[0] - p[0], dy = q[1] - p[1];
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len, ny = dx / len;
    const half = width / 2 + 1;
    ctx.beginPath();
    ctx.moveTo(p[0] + nx * half, p[1] + ny * half);
    ctx.lineTo(p[0] - nx * half, p[1] - ny * half);
    ctx.strokeStyle = "#e8edf5";
    ctx.lineWidth = 3;
    ctx.stroke();
  }

  function drawCar(car, state, rank) {
    let pt = pointAt(state.dFrac);
    // A pitting car is pulled toward the infield. There is no pit-lane geometry in the telemetry
    // this is built from, so the offset is a readable convention rather than a measured path.
    if (state.entry.pit && !state.finished) {
      pt = [pt[0] + (cx - pt[0]) * 0.11, pt[1] + (cy - pt[1]) * 0.11];
    }
    const p = project(pt[0], pt[1]);
    const r = Math.max(5, view.scale * 0.0125);

    ctx.beginPath();
    ctx.arc(p[0], p[1], r + 2.5, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(8,11,16,.85)";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(p[0], p[1], r, 0, Math.PI * 2);
    ctx.fillStyle = car.colour;
    ctx.globalAlpha = state.entry.pit ? 0.45 : 1;
    ctx.fill();
    ctx.globalAlpha = 1;

    if (rank === 0) {
      ctx.beginPath();
      ctx.arc(p[0], p[1], r + 4.5, 0, Math.PI * 2);
      ctx.strokeStyle = "#e8edf5";
      ctx.lineWidth = 1.6;
      ctx.stroke();
    }

    ctx.font = "600 " + Math.max(9, Math.round(r * 1.45)) + "px ui-monospace, Menlo, monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "#0a0d12";
    ctx.fillText(car.driver.slice(0, 3), p[0], p[1] + 0.5);
  }

  // ---------------------------------------------------------------- board
  const board = document.getElementById("board");
  let rows = new Map();

  function rowFor(car) {
    let row = rows.get(car.driver);
    if (row) return row;
    const el = document.createElement("div");
    el.className = "row";
    el.innerHTML =
      '<span class="pos"></span>' +
      '<span class="bar" style="background:' + car.colour + '"></span>' +
      '<span class="code"></span>' +
      '<span class="last"></span>' +
      '<span class="gap"></span>' +
      '<span class="tyre"></span>' +
      '<span class="age"></span>';
    board.appendChild(el);
    row = {
      el: el,
      pos: el.querySelector(".pos"),
      code: el.querySelector(".code"),
      last: el.querySelector(".last"),
      gap: el.querySelector(".gap"),
      tyre: el.querySelector(".tyre"),
      age: el.querySelector(".age"),
    };
    rows.set(car.driver, row);
    return row;
  }

  function updateBoard(order, fastest) {
    order.forEach(function (item, index) {
      const row = rowFor(item.car);
      const entry = item.state.entry;
      row.pos.textContent = String(index + 1);
      row.code.textContent = item.car.driver;
      const measured = item.state.measured;
      if (index === 0) {
        row.gap.textContent = item.state.finished ? "FINISHED" : "LEADER";
      } else if (entry.pit) {
        row.gap.innerHTML = '<span class="tag">IN PIT</span>';
      } else if (item.state.onGrid) {
        row.gap.textContent = "P" + item.car.grid;
      } else if (measured) {
        row.gap.textContent = "+" + measured.gapLeader.toFixed(1) + "s";
      } else {
        row.gap.textContent = "—";
      }
      const done = item.state.measured || (item.state.finished ? entry : null);
      row.last.textContent = done ? lapTime(done.time) : "—";
      row.code.classList.toggle(
        "fastest", !!(fastest && fastest.holder === item.car.driver)
      );
      row.tyre.textContent = entry.compound.slice(0, 1);
      row.tyre.style.background = DATA.compoundColours[entry.compound] || "#888";
      row.age.textContent = String(entry.age);
      row.el.classList.toggle("pitting", !!entry.pit);
      row.el.style.order = String(index);
    });

  }

  // ---------------------------------------------------------------- strategy panel
  // Every car's race as a proportional bar of stints. This is the shape a pit wall reasons in:
  // not "what tyre is on now" but "how long has each set lasted, and what is left to do".

  function renderStrategy() {
    const host = document.getElementById("stints");
    host.textContent = "";
    const ordered = DATA.cars.slice().sort(function (a, b) { return a.finish - b.finish; });
    for (const car of ordered) {
      const row = document.createElement("div");
      row.className = "srow";

      const code = document.createElement("span");
      code.className = "code";
      code.textContent = car.driver;
      code.style.color = car.colour;

      const bar = document.createElement("div");
      bar.className = "track-bar";
      for (const stint of car.stints) {
        const block = document.createElement("span");
        block.className = "stint";
        block.style.flex = String(Math.max(stint.share, 0.02));
        block.style.background = DATA.compoundColours[stint.compound] || "#808A99";
        block.title =
          stint.compound + " · laps " + stint.firstLap + "-" + stint.lastLap +
          " (" + stint.laps + ")";
        block.textContent = stint.laps >= 4 ? stint.compound.slice(0, 1) + stint.laps : "";
        bar.appendChild(block);
      }

      const stops = document.createElement("span");
      stops.className = "stops";
      stops.textContent = String(car.stops);

      row.append(code, bar, stops);
      host.appendChild(row);
    }
    document.getElementById("stintNote").textContent =
      DATA.totalLaps + " LAPS · STOPS";
  }

  // ---------------------------------------------------------------- conditions panel
  // Observed readings only. Nothing here feeds the simulation, and the panel says so, because a
  // temperature trace next to a simulated race implies a model this project does not have.

  function sparkline(values, stroke) {
    if (!values || values.length < 2) return "";
    const lo = Math.min.apply(null, values), hi = Math.max.apply(null, values);
    const span = hi - lo || 1;
    const points = values.map(function (value, index) {
      const x = (index / (values.length - 1)) * 100;
      const y = 34 - ((value - lo) / span) * 28;
      return x.toFixed(2) + "," + y.toFixed(2);
    });
    return (
      '<svg class="spark" viewBox="0 0 100 40" preserveAspectRatio="none" aria-hidden="true">' +
      '<polyline points="' + points.join(" ") + '" fill="none" stroke="' + stroke +
      '" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/></svg>'
    );
  }

  function renderConditions() {
    const host = document.getElementById("conditions");
    const c = DATA.conditions;
    if (!c) {
      host.innerHTML =
        '<div class="cond"><p class="cond-note">No ingested race at this circuit, so there are ' +
        'no recorded conditions to show.</p></div>';
      return;
    }
    const air = c.airTempC, track = c.trackTempC;
    const range = function (v) {
      return v.length ? Math.min.apply(null, v).toFixed(0) + "–" + Math.max.apply(null, v).toFixed(0) : "—";
    };
    const fastestTrap = c.teams.length ? c.teams[0].speedTrapKph : 0;

    const trapRows = c.teams.map(function (team) {
      const width = fastestTrap ? (team.speedTrapKph / fastestTrap) * 100 : 0;
      // Bars start at 85% of the fastest so the spread between teams is actually visible.
      const scaled = Math.max(0, (width - 85) / 15 * 100);
      return (
        '<div class="trap-row"><span>' + team.team +
        '<div class="trap-bar"><i style="width:' + scaled.toFixed(1) + '%"></i></div></span>' +
        "<b>" + team.speedTrapKph.toFixed(0) + "</b></div>"
      );
    }).join("");

    const compounds = c.compounds.map(function (entry) {
      const colour = DATA.compoundColours[entry[0]] || "#808A99";
      return (
        '<div class="trap-row"><span>' + entry[0] +
        '<div class="trap-bar"><i style="width:' +
        ((entry[1] / c.compounds[0][1]) * 100).toFixed(0) +
        '%;background:' + colour + '"></i></div></span><b>' + entry[1] + "</b></div>"
      );
    }).join("");

    host.innerHTML =
      '<div class="cond">' +
        '<p class="cond-note"><b>Recorded at ' + c.event + " " + c.season + ".</b> " +
        "These are real readings from that session, shown as context. The simulator is calibrated " +
        "on dry races only: it has no weather model and no engine model, so nothing on this tab " +
        "changes the race you are watching." +
        (c.wasDry ? "" : ' <span class="wet">That session ran wet.</span>') + "</p>" +

        '<div class="stat-row">' +
          '<div class="stat"><div class="k">Air</div><div class="v">' + range(air) +
            '<span class="u">°C</span></div>' + sparkline(air, "#5aa9ff") + "</div>" +
          '<div class="stat"><div class="k">Track</div><div class="v">' + range(track) +
            '<span class="u">°C</span></div>' + sparkline(track, "#ffd21f") + "</div>" +
        "</div>" +

        "<div><h4>Speed trap by team</h4>" +
        '<p class="cond-note">Straight-line speed, which is mostly power and drag &mdash; the ' +
        "closest thing to an engine reading in this data. Median km/h.</p>" +
        '<div class="trap">' + trapRows + "</div></div>" +

        "<div><h4>Tyres used that race</h4>" +
        '<div class="trap">' + compounds + "</div></div>" +
      "</div>";
  }

  // ---------------------------------------------------------------- clock + controls
  let clock = 0;
  let playing = false;
  let speed = 20;
  let last = 0;

  const elPlay = document.getElementById("play");
  const elRange = document.getElementById("range");
  const elClock = document.getElementById("clock");
  const elDone = document.getElementById("done");
  const elLap = document.getElementById("lap");
  const elFlag = document.getElementById("flag");
  const elFlagText = document.getElementById("flagText");

  function lapTime(seconds) {
    const m = Math.floor(seconds / 60);
    const s = (seconds - m * 60).toFixed(3).padStart(6, "0");
    return m + ":" + s;
  }

  function mmss(seconds) {
    const s = Math.max(0, Math.round(seconds));
    const m = Math.floor(s / 60);
    return m + ":" + String(s % 60).padStart(2, "0");
  }

  const SPEEDS = [1, 5, 20, 60, 200];
  const speedBox = document.getElementById("speeds");
  SPEEDS.forEach(function (value) {
    const b = document.createElement("button");
    b.textContent = value + "×";
    b.onclick = function () {
      speed = value;
      [].forEach.call(speedBox.children, function (c) { c.classList.remove("on"); });
      b.classList.add("on");
    };
    if (value === speed) b.classList.add("on");
    speedBox.appendChild(b);
  });

  elPlay.onclick = function () {
    playing = !playing;
    if (clock >= DURATION) clock = 0;
    elPlay.textContent = playing ? "‖" : "▶";
    last = performance.now();
  };
  elRange.oninput = function () {
    clock = (Number(elRange.value) / 1000) * DURATION;
    draw();
  };

  // Timeline bands for every neutralisation, positioned by the leader's crossing times.
  function renderBands() {
    const ticks = document.getElementById("ticks");
    [].slice.call(ticks.querySelectorAll(".band")).forEach(function (b) { b.remove(); });
    Object.keys(DATA.flags).forEach(function (lapKey) {
      const lap = Number(lapKey);
      const from = lap <= 1 ? 0 : LEADER_AT[lap - 2];
      const to = LEADER_AT[lap - 1];
      const band = document.createElement("div");
      band.className = "band " + DATA.flags[lapKey];
      band.style.left = (from / DURATION) * 100 + "%";
      band.style.width = Math.max(0.35, ((to - from) / DURATION) * 100) + "%";
      ticks.appendChild(band);
    });
  }

  // ---------------------------------------------------------------- frame
  function draw() {
    const flag = clock >= DURATION ? "end" : flagAt(clock);
    ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
    drawTrack(flag === "end" ? "green" : flag);

    const order = [];
    for (const car of CARS) {
      const state = stateOf(car, clock);
      if (!state) continue;
      // Live running order is distance covered: laps completed plus the fraction of this one. It
      // agrees with the recorded order at every line crossing and interpolates sensibly between.
      order.push({ car: car, state: state });
    }
    order.sort(function (a, b) { return b.state.order - a.state.order; });

    // Drawn back to front so the leader's ring is never hidden under a backmarker.
    for (let i = order.length - 1; i >= 0; i--) {
      drawCar(order[i].car, order[i].state, i);
    }
    updateBoard(order, fastestAt(clock));

    elLap.textContent = String(leaderLap(clock));
    elClock.textContent = mmss(clock) + " / " + mmss(DURATION);
    elRange.value = String(Math.round((clock / DURATION) * 1000));
    elDone.style.width = (clock / DURATION) * 100 + "%";

    elFlag.className = "flag" + (flag === "green" ? "" : " " + flag);
    elFlagText.textContent =
      flag === "sc" ? "SAFETY CAR" :
      flag === "vsc" ? "VIRTUAL SC" :
      flag === "end" ? "CHEQUERED" : "GREEN";
  }

  function tick(now) {
    if (playing) {
      const dt = Math.min(0.25, (now - last) / 1000);
      last = now;
      clock += dt * speed;
      if (clock >= DURATION) {
        clock = DURATION;
        playing = false;
        elPlay.textContent = "▶";
      }
      draw();
    }
    requestAnimationFrame(tick);
  }

  // ---------------------------------------------------------------- panels + picker
  const tabs = [].slice.call(document.querySelectorAll(".tab"));
  function showPanel(name) {
    tabs.forEach(function (tab) { tab.classList.toggle("on", tab.dataset.panel === name); });
    ["order", "strategy", "conditions"].forEach(function (key) {
      document.getElementById("panel-" + key).classList.toggle("on", key === name);
    });
  }
  tabs.forEach(function (tab) {
    tab.onclick = function () { showPanel(tab.dataset.panel); };
  });

  const picker = document.getElementById("circuit");
  RACES.forEach(function (race, index) {
    const option = document.createElement("option");
    option.value = String(index);
    option.textContent = race.circuit + " · " + race.totalLaps + " laps";
    picker.appendChild(option);
  });
  picker.onchange = function () { load(Number(picker.value), 0); };

  function load(index, at) {
    selectRace(index);
    picker.value = String(index);

    board.textContent = "";
    rows = new Map();
    renderStrategy();
    renderConditions();
    renderBands();

    document.getElementById("title").textContent = DATA.title;
    document.getElementById("subtitle").textContent =
      DATA.circuit + " · " + TRACK.lapDistanceM.toLocaleString() + " m lap · " +
      DATA.totalLaps + " laps · reference lap " + DATA.referenceLapS.toFixed(2) + "s";
    document.getElementById("totalLaps").textContent = "/" + DATA.totalLaps;
    document.getElementById("stamp").innerHTML =
      "track geometry: real position telemetry, " + DATA.circuit + " " + TRACK.season +
      "<br>race: simulated from params.json · run " + DATA.runId +
      "<br>pace level: " + DATA.anchorMode;

    clock = Math.min(at || 0, DURATION);
    layout();
    draw();
  }

  // ---------------------------------------------------------------- boot
  // A moment can be linked to: `#t=0.45` opens at 45% distance, `#t=1200s` at 1200 seconds, and
  // `#race=2` picks a circuit. Handy for pointing somebody at the safety car rather than asking
  // them to scrub to it.
  const hash = window.location.hash || "";
  const wantedRace = /race=(\d+)/.exec(hash);
  const start = /t=([0-9.]+)(s?)/.exec(hash);
  const index = wantedRace
    ? Math.min(RACES.length - 1, Number(wantedRace[1]))
    : Math.min(RACES.length - 1, BUNDLE.opening || 0);
  const wantedPanel = /panel=(order|strategy|conditions)/.exec(hash);
  if (wantedPanel) showPanel(wantedPanel[1]);

  selectRace(index);
  const at = start && isFinite(parseFloat(start[1]))
    ? (start[2] === "s" ? parseFloat(start[1]) : parseFloat(start[1]) * DURATION)
    : 0;
  load(index, at);

  window.addEventListener("resize", function () { layout(); draw(); });
  last = performance.now();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
